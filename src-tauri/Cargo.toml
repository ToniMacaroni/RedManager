[package]
name = "RedModManager"
version = "1.2.1"
description = "An installer and mod manager for the RedLoader mod loader."
authors = ["Toni Macaroni", "Za-Pa-Al"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.4", features = [] }

[dependencies]
tauri = { version = "1.4", features = [ "shell-all", "http-all", "path-all", "dialog-all", "fs-all"] }
tauri-plugin-window-state = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.5"
tokio = { version = "1", features = ["full"] }
regex = "*"
winreg = "*"
reqwest = { version = "0.11", features = ["stream"] }
futures-util = "0.3"
image = "0.24"
once_cell = "1.19"

[dependencies.windows]
version = "0.33.0"
features = [
    "alloc",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
]

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
